name: live-eval

# v3 冻结集真实模型评测（fail-closed）。
# 首次使用：手动触发 mode=baseline -> 下载 artifact -> 人工提交 eval/frozen/v3/BASELINE.json；
# 之后默认 mode=verify，交付回退/缺场景/缺成本/judge 缺失等会直接失败。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline 或 verify"
        required: true
        default: "verify"
      publish:
        description: "发布门禁：true 时 judge/content 失败即整 job 失败，report 走 --publish"
        type: boolean
        required: false
        default: false
      trials:
        description: "每个场景 trial 次数"
        required: true
        default: "1"
      quality_gate:
        description: "质量门禁：on 时剔除明确生活习惯冲突候选（默认 off）"
        required: false
        default: "off"
      price_input_per_m:
        description: "输入 token 单价（每百万，发布前必填）"
        required: false
        default: ""
      price_output_per_m:
        description: "输出 token 单价（每百万，发布前必填）"
        required: false
        default: ""
      max_tokens:
        description: "本次 token 预算上限（0=不限制）"
        required: false
        default: "2500000"
  schedule:
    - cron: '0 18 * * 0'   # 每周一 02:00 Asia/Shanghai

concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  live-eval:
    name: live-eval-v3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_BASE: http://127.0.0.1:8080
      MATCH_TIMEOUT_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=ci-root-password
          MYSQL_DATABASE=paringbot
          MYSQL_USER=paringbot
          MYSQL_PASSWORD=ci-paringbot-password
          JWT_SECRET=ci-only-jwt-secret-not-for-production
          APP_PORT=8080
          PUBLIC_BASE_URL=
          MATCH_TIMEOUT_SECONDS=600
          QUALITY_GATE=${{ github.event.inputs.quality_gate || 'off' }}
          MAX_UPLOAD_MB=5
          TZ=Asia/Shanghai
          LOGIN_MAX_FAILS=20
          LOGIN_FAIL_WINDOW_SECONDS=300
          LOGIN_LOCK_SECONDS=300
          LOGIN_RATE_LIMIT_ENABLED=true
          CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build and start eval stack
        run: docker compose -f docker-compose.yml -f docker-compose.eval.yml up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS -X POST "$APP_BASE/api/login" \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123"}' | grep -q '"code":"200"'; then
              echo "stack ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::ParingBot stack did not become ready in 10 minutes"
          docker compose logs --tail=200
          exit 1

      - name: Guard model key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::缺少 DEEPSEEK_API_KEY secret，真实评测无法运行"
            exit 1
          fi

      - name: Configure live models
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_LABEL: live-${{ github.run_id }}
        run: |
          cat > .env.eval <<EOF
          EVAL_PROVIDER=deepseek
          EVAL_API_KEY=${DEEPSEEK_API_KEY}
          EVAL_MAX_TOKENS=8192
          EVAL_APP_BASE=${APP_BASE}
          EVAL_ADMIN_USERNAME=admin
          EVAL_ADMIN_PASSWORD=admin123
          EVAL_SUITE=v3
          DB_PROFILE=eval
          EVAL_LABEL=${RUN_LABEL}
          EVAL_TRIALS=${{ github.event.inputs.trials || '1' }}
          EVAL_BUNDLE_TRIALS=${{ github.event.inputs.trials || '1' }}
          EVAL_POLL_SECONDS=3
          EVAL_MAX_WAIT_SECONDS=650
          EOF
          sed -i 's/^[[:space:]]*//' .env.eval
          python eval/configure_models.py --env-file .env.eval

      - name: Freeze check
        run: |
          python eval/check_freeze.py
          python eval/build_frozen_labels.py --verify

      - name: Run v3 matrix
        env:
          TRIALS: ${{ github.event.inputs.trials || '1' }}
          RUN_LABEL: live-${{ github.run_id }}
        run: |
          python eval/run_matrix.py --suite v3 --trials "$TRIALS" \
            --label "$RUN_LABEL" --stamp "$RUN_LABEL"

      - name: Build quality bundle
        env:
          GIT_COMMIT: ${{ github.sha }}
          EVAL_BUNDLE_TRIALS: ${{ github.event.inputs.trials || '1' }}
        run: |
          LABELS_HASH=$(sha256sum eval/frozen/v3/labels.json | cut -d' ' -f1)
          SCENARIOS_HASH=$(sha256sum eval/frozen/v3/scenarios.json | cut -d' ' -f1)
          # 每个申请人导出最近 N 次运行，bundle meta 记录 bundle_trials/run_ids/prompts_sha256
          docker compose exec -T -e GIT_COMMIT="$GIT_COMMIT" -e EVAL_SUITE=v3 -e DB_PROFILE=eval \
            -e EVAL_BUNDLE_TRIALS="$EVAL_BUNDLE_TRIALS" -e LABELS_HASH="$LABELS_HASH" \
            -e SCENARIOS_HASH="$SCENARIOS_HASH" -e MATCH_TIMEOUT_SECONDS=600 \
            backend python - < eval/build_bundle.py > quality-bundle.json

      - name: Optional independent judge
        env:
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
          PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          # publish=true 时 judge 失败必须让 job 失败（fail-closed）；非 publish 保持可选
          if [ -z "$EVAL_JUDGE_API_KEY" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::publish=true 需要 EVAL_JUDGE_API_KEY secret，不能静默跳过独立 judge"
              exit 1
            fi
            echo "未配置 EVAL_JUDGE_API_KEY，跳过独立 judge（发布前必须补）"
          else
            printf '\nEVAL_JUDGE_PROVIDER=%s\nEVAL_JUDGE_BASE_URL=%s\nEVAL_JUDGE_API_KEY=%s\nEVAL_JUDGE_MODEL=%s\n' \
              "${{ secrets.EVAL_JUDGE_PROVIDER }}" "${{ secrets.EVAL_JUDGE_BASE_URL }}" \
              "$EVAL_JUDGE_API_KEY" "${{ secrets.EVAL_JUDGE_MODEL }}" >> .env.eval
            python eval/judge.py --bundle quality-bundle.json --mode pointwise \
              --sample-not-delivered 8 --out judge-report.md --json judge-report.json \
              || [ "$PUBLISH" != "true" ]
          fi

      - name: Optional content quality
        env:
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
          PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          # 与 judge 同样的 fail-closed 口径：publish=true 时失败即 job 失败
          if [ -z "$EVAL_JUDGE_API_KEY" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::publish=true 需要 EVAL_JUDGE_API_KEY secret，不能静默跳过内容质量评审"
              exit 1
            fi
            echo "未配置 EVAL_JUDGE_API_KEY，跳过内容质量代理评审"
          else
            printf '\nEVAL_JUDGE_PROVIDER=%s\nEVAL_JUDGE_BASE_URL=%s\nEVAL_JUDGE_API_KEY=%s\nEVAL_JUDGE_MODEL=%s\n' \
              "${{ secrets.EVAL_JUDGE_PROVIDER }}" "${{ secrets.EVAL_JUDGE_BASE_URL }}" \
              "$EVAL_JUDGE_API_KEY" "${{ secrets.EVAL_JUDGE_MODEL }}" >> .env.eval
            python eval/content_quality.py --bundle quality-bundle.json --limit 20 \
              --env-file .env.eval --out content-report.md --json content-report.json \
              || [ "$PUBLISH" != "true" ]
          fi

      - name: Report + gates
        env:
          MODE: ${{ github.event.inputs.mode || 'verify' }}
          PUBLISH: ${{ github.event.inputs.publish || 'false' }}
          RUN_LABEL: live-${{ github.run_id }}
          PRICE_IN: ${{ github.event.inputs.price_input_per_m }}
          PRICE_OUT: ${{ github.event.inputs.price_output_per_m }}
          MAX_TOKENS: ${{ github.event.inputs.max_tokens || '2500000' }}
        run: |
          EXTRA=()
          if [ -n "$PRICE_IN" ] && [ -n "$PRICE_OUT" ]; then
            EXTRA+=(--price-input-per-m "$PRICE_IN" --price-output-per-m "$PRICE_OUT" --require-cost)
          fi
          # publish=true 时 report 走 --publish：judge/content 报告缺失即失败
          if [ "$PUBLISH" = "true" ]; then
            EXTRA+=(--publish)
          fi
          # 独立 judge 报告存在时一并交给 report 校验（publish 模式必需，非 publish 仅记录）
          if [ -f judge-report.json ]; then
            EXTRA+=(--judge judge-report.json)
          fi
          python eval/report.py --bundle quality-bundle.json --matrix eval/reports \
            --matrix-stamp "$RUN_LABEL" --source-run "${{ github.run_id }}" \
            --labels eval/frozen/v3/labels.json \
            --scenarios eval/frozen/v3/scenarios.json \
            --manifest eval/frozen/v3/MANIFEST.json \
            --mode "$MODE" --max-tokens "${MAX_TOKENS:-0}" --baseline-out v3-baseline.json \
            "${EXTRA[@]}" --out regression-report.md --json regression-report.json
          python eval/safety_checks.py --bundle quality-bundle.json \
            --out safety-report.md --json safety-report.json

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-${{ github.run_id }}
          path: |
            regression-report.md
            regression-report.json
            quality-bundle.json
            safety-report.md
            safety-report.json
            judge-report.md
            judge-report.json
            content-report.md
            content-report.json
            v3-baseline.json
            eval/reports
            eval/frozen/v3/scenarios.json
            eval/frozen/v3/labels.json
            eval/frozen/v3/BASELINE.json
            eval/frozen/v3/MANIFEST.json
          if-no-files-found: ignore
          retention-days: 30

