name: live-eval

# 手动触发的真实模型评测：会真实消耗 DeepSeek token。
# 使用前在仓库 Settings → Secrets and variables → Actions 配置 DEEPSEEK_API_KEY。
on:
  workflow_dispatch:
    inputs:
      trials:
        description: "每个场景 trial 次数"
        required: true
        default: "1"
      scenarios:
        description: "场景列表，逗号分隔（默认全部 20 个，含负向场景）"
        required: true
        default: "S1,S2,S3,S4,S5,S6,S7,S8,S9,S10,S11,S12,S13,S14,S15,S16,S17,S18,S19,S20"
      min_precision:
        description: "heuristic Precision@K 最低阈值"
        required: true
        default: "0.6"

jobs:
  live-eval:
    name: live-eval
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-root-password
          MYSQL_DATABASE=paringbot
          MYSQL_USER=paringbot
          MYSQL_PASSWORD=ci-paringbot-password
          JWT_SECRET=ci-only-jwt-secret-not-for-production
          APP_PORT=8080
          PUBLIC_BASE_URL=
          MATCH_TIMEOUT_SECONDS=1200
          MAX_UPLOAD_MB=5
          TZ=Asia/Shanghai
          LOGIN_MAX_FAILS=20
          LOGIN_FAIL_WINDOW_SECONDS=300
          LOGIN_LOCK_SECONDS=300
          LOGIN_RATE_LIMIT_ENABLED=true
          CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS -X POST "$APP_BASE/api/login" \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123"}' | grep -q '"code":"200"'; then
              echo "stack ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::ParingBot stack did not become ready in 10 minutes"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Guard model key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::缺少 DEEPSEEK_API_KEY secret，真实评测无法运行"
            exit 1
          fi

      - name: Configure live models
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRIALS: ${{ github.event.inputs.trials }}
          RUN_LABEL: live-${{ github.run_id }}
        run: |
          cat > .env.eval <<EOF
          EVAL_PROVIDER=deepseek
          EVAL_API_KEY=${DEEPSEEK_API_KEY}
          EVAL_MAX_TOKENS=8192
          EVAL_APP_BASE=${APP_BASE}
          EVAL_ADMIN_USERNAME=admin
          EVAL_ADMIN_PASSWORD=admin123
          EVAL_MEMBER_USERNAME=member02
          EVAL_MEMBER_PASSWORD=123456
          EVAL_LABEL=${RUN_LABEL}
          EVAL_TRIALS=${TRIALS}
          EVAL_POLL_SECONDS=3
          EVAL_MAX_WAIT_SECONDS=1200
          EOF
          sed -i 's/^[[:space:]]*//' .env.eval
          python eval/configure_models.py --env-file .env.eval

      - name: Run selected scenarios
        env:
          TRIALS: ${{ github.event.inputs.trials }}
          SCENARIOS: ${{ github.event.inputs.scenarios }}
          RUN_LABEL: live-${{ github.run_id }}
        run: |
          python eval/scenario_matrix.py --env-file .env.eval \
            --only "$SCENARIOS" --trials "$TRIALS" \
            --label "$RUN_LABEL" --stamp "$RUN_LABEL"

      - name: Build quality bundle
        run: |
          docker compose exec -T backend python - < eval/build_quality_bundle.py > quality-bundle.json

      - name: Regression + safety report
        env:
          MIN_PRECISION: ${{ github.event.inputs.min_precision }}
        run: |
          python eval/regression_report.py --bundle quality-bundle.json \
            --out regression-report.md --json regression-report.json \
            --min-precision "$MIN_PRECISION" --min-consensus 0.6
          python eval/safety_checks.py --bundle quality-bundle.json \
            --out safety-report.md --json safety-report.json

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Upload live-eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-${{ github.run_id }}
          path: |
            regression-report.md
            regression-report.json
            safety-report.md
            safety-report.json
            quality-bundle.json
            eval/reports
          if-no-files-found: ignore
          retention-days: 14
