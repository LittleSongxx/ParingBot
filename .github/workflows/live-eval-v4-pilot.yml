name: live-eval-v4-pilot

# v4 试跑：默认 9 个场景 ×3 trials（高/中/低各 3），只跑矩阵，不接门禁。
# keys=all 时跑全部 40 个正向场景；同时导出 quality-bundle-v4.json（EVAL_BUNDLE_TRIALS=3）
# 供 pass^k/CI 复算。依赖 EVAL_JUDGE_API_KEY 的 labels/judge 步骤本 workflow 不跑。
on:
  workflow_dispatch:
    inputs:
      keys:
        description: "要跑的场景 key（逗号分隔；all = 全部 40 个正向场景）"
        required: false
        default: "V4_01,V4_02,V4_03,V4_17,V4_18,V4_19,V4_29,V4_30,V4_31"
      trials:
        description: "每个场景 trial 次数"
        required: false
        default: "3"
      soft_filter_mode:
        description: "筛选 A/B：current=保持现状，hard=只让必须项进 SQL 硬筛（加分项忽略）"
        required: false
        default: "current"

concurrency:
  group: live-eval-v4-pilot
  cancel-in-progress: false

jobs:
  live-eval-v4-pilot:
    name: live-eval-v4-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      APP_BASE: http://127.0.0.1:8080
      MATCH_TIMEOUT_SECONDS: "600"
      PILOT_KEYS: ${{ github.event.inputs.keys || 'V4_01,V4_02,V4_03,V4_17,V4_18,V4_19,V4_29,V4_30,V4_31' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=ci-root-password
          MYSQL_DATABASE=paringbot
          MYSQL_USER=paringbot
          MYSQL_PASSWORD=ci-paringbot-password
          JWT_SECRET=ci-only-jwt-secret-not-for-production
          APP_PORT=8080
          PUBLIC_BASE_URL=
          MATCH_TIMEOUT_SECONDS=600
          SCREENER_FILTER_MODE=${{ github.event.inputs.soft_filter_mode || 'current' }}
          MAX_UPLOAD_MB=5
          TZ=Asia/Shanghai
          LOGIN_MAX_FAILS=20
          LOGIN_FAIL_WINDOW_SECONDS=300
          LOGIN_LOCK_SECONDS=300
          LOGIN_RATE_LIMIT_ENABLED=true
          CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build and start eval stack
        run: docker compose -f docker-compose.yml -f docker-compose.eval.yml up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS -X POST "$APP_BASE/api/login" \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123"}' | grep -q '"code":"200"'; then
              echo "stack ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::ParingBot stack did not become ready in 10 minutes"
          docker compose logs --tail=200
          exit 1

      - name: Guard model key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::缺少 DEEPSEEK_API_KEY secret"
            exit 1
          fi

      - name: Configure live models
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_LABEL: v4-pilot-${{ github.run_id }}
        run: |
          cat > .env.eval <<EOF
          EVAL_PROVIDER=deepseek
          EVAL_API_KEY=${DEEPSEEK_API_KEY}
          EVAL_MAX_TOKENS=8192
          EVAL_APP_BASE=${APP_BASE}
          EVAL_ADMIN_USERNAME=admin
          EVAL_ADMIN_PASSWORD=admin123
          EVAL_SUITE=v4
          DB_PROFILE=eval
          EVAL_LABEL=${RUN_LABEL}
          EVAL_TRIALS=${{ github.event.inputs.trials || '3' }}
          EVAL_POLL_SECONDS=3
          EVAL_MAX_WAIT_SECONDS=650
          EOF
          sed -i 's/^[[:space:]]*//' .env.eval
          python eval/configure_models.py --env-file .env.eval

      - name: Freeze checks
        run: |
          python eval/check_freeze.py
          python eval/check_v4_freeze.py

      - name: Run v4 pilot matrix
        env:
          RUN_LABEL: v4-pilot-${{ github.run_id }}
        run: |
          SELECTED_KEYS="$PILOT_KEYS"
          if [ "$(printf '%s' "$PILOT_KEYS" | tr '[:upper:]' '[:lower:]')" = "all" ]; then
            # all = 冻结集里的全部正向场景（负向场景不消耗模型调用，仍按需单独跑）
            SELECTED_KEYS=$(python3 -c 'import json; data = json.load(open("eval/frozen/v4/scenarios.json")); print(",".join(item["key"] for item in data["scenarios"] if item.get("run")))')
          fi
          python eval/run_matrix.py --suite v4 --only "$SELECTED_KEYS" \
            --trials "${{ github.event.inputs.trials || '3' }}" \
            --label "$RUN_LABEL" --stamp v4-pilot

      - name: Build quality bundle (v4, 3 trials)
        continue-on-error: true
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          SCENARIOS_HASH=$(sha256sum eval/frozen/v4/scenarios.json | cut -d' ' -f1)
          # EVAL_BUNDLE_TRIALS=3：每个申请人导出最近 3 次运行，meta 记录 run_ids/prompts_sha256
          docker compose exec -T -e GIT_COMMIT="$GIT_COMMIT" -e EVAL_SUITE=v4 -e DB_PROFILE=eval \
            -e EVAL_BUNDLE_TRIALS=3 -e SCENARIOS_HASH="$SCENARIOS_HASH" \
            -e MATCH_TIMEOUT_SECONDS=600 \
            backend python - < eval/build_bundle.py > quality-bundle-v4.json

      - name: Analyze pilot
        run: |
          python eval/analyze_pilot.py \
            --matrix eval/reports/scenario-matrix-v4-pilot/matrix.json \
            --scenarios eval/frozen/v4/scenarios.json \
            --out v4-pilot-report.md --json v4-pilot-report.json

      - name: Quality scorecard (always)
        if: always()
        run: |
          python eval/quality_scorecard.py --run .             --out quality-card.md --json quality-card.json || true

      - name: Dump backend logs (always)
        if: always()
        run: |
          docker compose logs --tail=5000 > compose-logs.txt || true
          docker compose logs backend --tail=5000 > backend-logs.txt || true
          grep -E "Traceback|ERROR|异常|exception" -A 20 backend-logs.txt > backend-failures.txt || true

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-v4-pilot-${{ github.run_id }}
          path: |
            eval/reports
            v4-pilot-report.md
            v4-pilot-report.json
            quality-bundle-v4.json
            compose-logs.txt
            backend-logs.txt
            backend-failures.txt
            quality-card.md
            quality-card.json
            eval/frozen/v4/scenarios.json
            eval/frozen/v4/MANIFEST.json
          if-no-files-found: ignore
          retention-days: 14
