name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paringbot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: paringbot
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ci-only-secret
      PUBLIC_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Import seed database
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do sleep 2; done
          for f in deploy/mysql/init/*.sql; do
            echo "import $f"
            mysql -h127.0.0.1 -uroot -proot paringbot < "$f"
          done
      - name: pytest
        working-directory: backend
        run: pytest -q
      - name: AI 能力评测（Phase 0 fixtures）
        run: |
          python eval/run_eval.py --fixtures --bad eval/fixtures/bad
          python -m py_compile eval/configure_models.py eval/run_live_eval.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
