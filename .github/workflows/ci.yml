name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback:
        description: "回滚到上一个 release bundle（不部署新代码）"
        type: boolean
        default: false

# 并发语义：push 只取消 push 的旧跑；dispatch（部署/回滚演练）不与任何人在同组互抢——
# 此前 push 与 dispatch 同组 + cancel-in-progress，一次 push 会把进行中的 deploy job
# 掐在半途（2026-10-16 实测：38914161066 被取消后重跑）。部署与运维动词之间的互斥
# 改由 deploy job 与 ops workflow 共享 `smartlect-deploy` 组承担（cancel-in-progress: false）。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # 2026-10-16：从 `mvn test` 升级为 `-Pintegration verify`（含 7 个 testcontainers 真库 IT、
    # jacoco 覆盖率地板与棘轮门禁）。此前集成档只在本地手工跑，surefire 盲区里的致命问题
    # （Outbox 认领 SQL 方言、租约语义）曾两次漏到部署期才发现。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn -Pintegration verify（单测 + 真库 IT + 覆盖率门禁）
        run: mvn -B -f backend/pom.xml -Pintegration verify
      - name: 覆盖率棘轮（对比 backend/jacoco-baseline.txt，±1pp）
        run: python3 scripts/coverage_gate.py
      # 管理端授权门禁：新增写接口若既无权限注解/二次确认、又不在 TrialAdminAccess
      # 拒绝清单内，这里直接红（2026-10-17 审计 M2：此前只挂在本机 dev.sh check）
      - name: 管理端授权门禁（写接口必须注解/确认/在拒绝清单内）
        run: python3 scripts/check_admin_authz.py
      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
            backend/**/target/site/jacoco/**

  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装锁定依赖 + 本包
        run: |
          pip install -r assistant/requirements.lock
          pip install --no-deps --no-build-isolation ./assistant
      # 2026-09-19 教训：旧锁漏 langfuse 闭包且 packaging/wrapt 与其元数据冲突，
      # 本地 pip check 断链而 CI 不查——锁漂移必须在这里红出来
      - name: pip check（锁闭包完整性）
        run: pip check
      - name: unittest
        working-directory: assistant
        run: python -m unittest discover -s tests
      # The MySQL-backed contract tests own one disposable container each and skip
      # themselves without this flag; leaving it unset is how 18 real failures stayed
      # invisible while the suite reported green (142 skips).
      - name: unittest（真实 MySQL 契约测试）
        working-directory: assistant
        env:
          SMARTLECT_RUN_MYSQL_TESTS: "1"
        run: python -m unittest discover -s tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dir: [user, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.dir }}/package-lock.json
      - name: npm ci + test
        run: |
          npm --prefix web/${{ matrix.dir }} ci
          npm --prefix web/${{ matrix.dir }} test
      # 前端产物在这里构建，部署时只下发 dist：服务器没有 npm 构建的 CPU/依赖开销，
      # 也避免"服务器构建和 CI 构建不一致"。CI 的构建失败会直接拦住部署。
      - name: npm run build + 上传 dist
        run: |
          npm --prefix web/${{ matrix.dir }} run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ matrix.dir }}
          path: web/${{ matrix.dir }}/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    # 只允许从 main 派发部署；提交未推送时 gh workflow run --ref main 取远程 main——
    # 两者都防"部署了不受控的代码"（2026-10-16 实测过一次误派发旧代码的 run）。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.rollback
    needs: [backend, assistant, web]
    runs-on: ubuntu-latest
    # 部署动作与 ops workflow（status/rollback）共享同组：串行、互不取消
    concurrency:
      group: smartlect-deploy
      cancel-in-progress: false
    # 40 分钟：打包+冒烟+重启典型 ~15 分钟；2026-10-15 冒烟因磁盘满挂起时 30 分钟被撞满，
    # job 在重启前被取消——冒烟已修（截止强制），此余量防同类尾部风险。
    timeout-minutes: 40
    env:
      # 长重启期间无输出，必须带 keepalive 防中间层掐连接
      SSH_CMD: ssh -i ~/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置 deploy key（服务器网关仅放行 upload/upload-dist/deploy/status/rollback）
        run: |
          install -m600 /dev/stdin ~/deploy_key <<<"${{ secrets.SMARTLECT_DEPLOY_KEY }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: 回滚（inputs.rollback=true 时）
        if: ${{ inputs.rollback }}
        run: $SSH_CMD root@39.96.202.14 rollback
      - name: 打 bundle 并上传
        if: ${{ !inputs.rollback }}
        run: |
          git bundle create deploy.bundle HEAD
          $SSH_CMD root@39.96.202.14 upload < deploy.bundle
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.rollback }}
        with:
          name: web-dist-user
          path: web/user/dist
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.rollback }}
        with:
          name: web-dist-admin
          path: web/admin/dist
      - name: 下发前端 dist（网关新增 upload-dist 动词）
        if: ${{ !inputs.rollback }}
        run: |
          tar czf web-dist.tar.gz web/user/dist web/admin/dist
          ls -la web-dist.tar.gz
          $SSH_CMD root@39.96.202.14 upload-dist < web-dist.tar.gz
      - name: 部署 + 健康门禁（失败即 exit 1）
        if: ${{ !inputs.rollback }}
        run: $SSH_CMD root@39.96.202.14 deploy
      - name: 部署后状态
        if: always()
        run: $SSH_CMD root@39.96.202.14 status || true
