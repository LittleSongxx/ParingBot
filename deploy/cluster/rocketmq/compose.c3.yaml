# RocketMQ 集群（node1/2/3 各一份）—— host 网络
#
# 用法（各节点）：
#   cd /opt/cluster/rocketmq && docker compose -f compose.cN.yaml --env-file .env up -d --wait
# broker 为 DLedger 三副本（Raft 自动选主），namesrv 与 proxy 每节点一份；
# 应用侧 SMARTLECT_ROCKETMQ_ENDPOINTS 指向三个 proxy 的 gRPC 端口（逗号分隔）。
# broker 的 dLeger 配置由 build-rocketmq.sh 按 nodes.env 生成到本目录 conf/ 下。

services:
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-namesrv
    network_mode: host
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/9876"']
      interval: 10s
      timeout: 5s
      retries: 30

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-broker
    network_mode: host
    command: sh mqbroker -c /home/rocketmq/conf/smartlect-dledger.conf
    depends_on:
      rocketmq-namesrv: {condition: service_healthy}
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - ./conf:/home/rocketmq/conf:ro
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/10911"']
      interval: 10s
      timeout: 10s
      retries: 60

  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-proxy
    network_mode: host
    command: sh mqproxy -n 127.0.0.1:9876
    depends_on:
      rocketmq-broker: {condition: service_healthy}
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/8081"']
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  rocketmq-broker-data:
