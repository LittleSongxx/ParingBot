# node1 基础设施的集群期 override（叠加在 deploy/compose.yaml 之上）
#
# 用法（node1 执行）：
#   docker compose -p smartlect --env-file run/runtime.env \
#     -f deploy/compose.yaml -f deploy/cluster/compose.node1.yaml up -d --wait
#
# 作用：
#   1) mysql / redis 增加内网绑定 —— node2/3 的 nacos 成员、redis 副本、应用副本要跨机访问
#   2) redis 补 masterauth —— 集群期主库可能被 sentinel 降级为副本，降级后要向新主认证
#   3) 单机 rocketmq 三件套 / nacos 挂到 single-only profile —— 集群期由
#      /opt/cluster/rocketmq（host 网络）与 nacos-c1 接管；数据卷原样保留，回退即恢复
#
# 注意：compose 对 ports 是**合并**语义，基线里的 127.0.0.1 绑定仍然生效。

services:
  mysql:
    ports:
      - "${NODE1_IP:?source deploy/cluster/nodes.env}:${SMARTLECT_MYSQL_PORT:?}:3306"

  redis:
    command: [sh, -ec, 'exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"']
    ports:
      - "${NODE1_IP:?source deploy/cluster/nodes.env}:${REDIS_PORT:-6379}:6379"

  # 应用副本（node2/3）的 xxl-job 执行器要连调度中心——基线绑定 127.0.0.1，叠加内网绑定。
  xxl-job-admin:
    ports:
      - "${NODE1_IP:-0.0.0.0}:${SMARTLECT_XXLJOB_PORT:-18090}:8080"

  rocketmq-namesrv:
    profiles: ["single-only"]

  rocketmq-broker:
    profiles: ["single-only"]

  # 集群期应用副本（node2/3）与应用主进程都经内网 IP 访问 node1 的单机 proxy——
  # 基线 compose 把 8081 绑在 127.0.0.1，这里叠加内网绑定（ports 是合并语义）。
  rocketmq-proxy:
    profiles: ["single-only"]
    ports:
      - "${NODE1_IP:-0.0.0.0}:${SMARTLECT_ROCKETMQ_GRPC_PORT:-8081}:8081"

  nacos:
    profiles: ["single-only"]
