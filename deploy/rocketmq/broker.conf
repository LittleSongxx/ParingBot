# RocketMQ 5.x 单机 broker 配置（deploy/compose.yaml 挂载）
# 集群（DLedger）形态见 deploy/cluster/，由脚本生成独立配置覆盖本文件字段。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 单机 master；DLedger 形态由 cluster 脚本覆盖为 DLedger 模式
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48
# 演示环境开启自动建 Topic：canal 直投与业务 Topic 免预声明（生产应关闭并显式运维）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
# 5.x 任意精度定时消息依赖 timer wheel（5.x 默认开启，显式声明防止被基线覆盖）
timerWheelEnable = true
# compose 网络内以服务名路由（proxy 与 Java 客户端经 proxy 访问）
brokerIP1 = rocketmq-broker
listenPort = 10911
# root 运行时 JVM user.home=/root，默认 store 落在容器文件系统（重建即丢），
# 显式指向挂载卷
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
