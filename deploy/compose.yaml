name: smartlect

services:
  mysql:
    image: mysql:8.4.11
    ports: ["127.0.0.1:${SMARTLECT_MYSQL_PORT:?run bootstrap}:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${SMARTLECT_MYSQL_ROOT_PASSWORD:?run bootstrap}
      SMARTLECT_MYSQL_PASSWORD: ${SMARTLECT_MYSQL_PASSWORD:?run bootstrap}
      SMARTLECT_FLYWAY_PASSWORD: ${SMARTLECT_FLYWAY_PASSWORD:?run bootstrap}
      SMARTLECT_NACOS_MYSQL_PASSWORD: ${SMARTLECT_NACOS_MYSQL_PASSWORD:?run bootstrap}
      SMARTLECT_GROWTH_MYSQL_PASSWORD: ${SMARTLECT_GROWTH_MYSQL_PASSWORD:?run bootstrap}
      SMARTLECT_CANAL_MYSQL_PASSWORD: ${SMARTLECT_CANAL_MYSQL_PASSWORD:?run bootstrap}
      SMARTLECT_XXLJOB_MYSQL_PASSWORD: ${SMARTLECT_XXLJOB_MYSQL_PASSWORD:?run bootstrap}
      TZ: Asia/Shanghai
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_general_ci, --innodb_buffer_pool_size=512M, --max_connections=200,
              --server-id=1, --log-bin=binlog, --binlog-format=ROW, --binlog-row-image=FULL]
    volumes:
      - mysql:/var/lib/mysql
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/00-smartlect.sh:ro
      - ./sql/14-nacos.sql:/docker-entrypoint-initdb.d/14-nacos.sql:ro
      # 建表脚本必须挂在 MySQL 的 initdb 目录；之前误挂在 xxl-job-admin 容器上，从未被执行。
      - ./sql/16-xxljob.sql:/docker-entrypoint-initdb.d/16-xxljob.sql:ro
    # 8c32g 后余量充足：512M buffer pool + 2g 上限（1g 时常驻 748MB 已逼近）；
    # max_connections 160→200 给 assistant 线程本地复用与未来多副本留余量
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7.4.7-alpine
    ports: ["127.0.0.1:${SMARTLECT_REDIS_PORT:?run bootstrap}:6379"]
    environment:
      REDIS_PASSWORD: ${SMARTLECT_REDIS_PASSWORD:?run bootstrap}
    command: [sh, -ec, 'exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis:/data]
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports:
      - "127.0.0.1:${SMARTLECT_ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/9876"']
      interval: 5s
      timeout: 3s
      retries: 30

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/smartlect-broker.conf
    depends_on:
      rocketmq-namesrv: {condition: service_healthy}
    # 命名卷初建属主 root，镜像内 rocketmq 用户(uid 3000)写 store 会权限失败（实测
    # ScheduleMessageService NPE 即此因），演示环境以 root 运行规避。
    user: "0:0"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/conf/smartlect-broker.conf:ro
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/10911"']
      interval: 5s
      timeout: 5s
      retries: 40

  # 业务 Topic 预建：autoCreateTopicEnable 只对发送生效，5.x 客户端**订阅**时
  # 即校验路由（No topic route info 会让消费者启动直接 FAILED），必须显式建。
  rocketmq-topic-init:
    image: apache/rocketmq:5.3.2
    # 单机形态专属（集群态 Topic 由 build-rocketmq.sh 预建），随 broker 一起挂 single-only，
    # 否则集群态下它依赖的 broker 未激活会被 compose 判为 invalid project。
    profiles: ["single-only"]
    depends_on:
      rocketmq-broker: {condition: service_healthy}
    entrypoint: [sh, -ec]
    command:
      - |
        # 注意必须显式 +message.type=NORMAL：5.3.2 mqadmin 不带 -a 时会给新 Topic 写
        # "NORMAL,DELAY" 组合默认值，而 proxy 校验路径 Enum.valueOf 不认多值组合，订阅即 50001。
        for topic in smartlect-pay smartlect-refund smartlect-rush smartlect-canal smartlect-mq-failure; do
          for i in $(seq 1 30); do
            sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t $$topic -a "+message.type=NORMAL" >/dev/null 2>&1 && break
            sleep 2
          done
        done
        # 定时消息专用 Topic：message.type=DELAY（单值可经 CLI 表达；NORMAL,DELAY 多值
        # 的逗号与 -a 的属性分隔符冲突，无法设置，故定时消息独立成 Topic）
        for i in $(seq 1 30); do
          sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t smartlect-delay -a "+message.type=DELAY" >/dev/null 2>&1 && break
          sleep 2
        done
        echo "topics ready"
    restart: "no"

  # gRPC Proxy：5.x 新客户端（rocketmq-client-java）统一经 proxy 接入，
  # 定时消息/事务语义在 proxy 后面的 broker 集群上保持。
  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    command: sh mqproxy -n rocketmq-namesrv:9876
    depends_on:
      rocketmq-broker: {condition: service_healthy}
      rocketmq-topic-init: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:${SMARTLECT_ROCKETMQ_GRPC_PORT:?run bootstrap}:8081"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/8081"']
      interval: 5s
      timeout: 3s
      retries: 30

  nacos:
    image: nacos/nacos-server:v2.5.3
    ports:
      - "127.0.0.1:${SMARTLECT_NACOS_PORT:?run bootstrap}:8848"
      - "127.0.0.1:${SMARTLECT_NACOS_GRPC_PORT:?run bootstrap}:9848"
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${SMARTLECT_NACOS_AUTH_TOKEN:?run bootstrap}
      NACOS_AUTH_IDENTITY_KEY: smartlect-server
      NACOS_AUTH_IDENTITY_VALUE: ${SMARTLECT_NACOS_IDENTITY:?run bootstrap}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: smartlect_nacos
      MYSQL_SERVICE_USER: smartlect_nacos
      MYSQL_SERVICE_PASSWORD: ${SMARTLECT_NACOS_MYSQL_PASSWORD:?run bootstrap}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    mem_limit: 768m
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8848/nacos/v1/console/health/readiness]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  elasticsearch:
    # 自建镜像预装 IK 分词插件（deploy/elasticsearch/Dockerfile）；
    # stock 镜像不带任何中文分词插件，检索会退化到 standard 单字切分。
    build: ./elasticsearch
    image: smartlect/elasticsearch-ik:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${SMARTLECT_ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:${SMARTLECT_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  # Canal：伪装 MySQL 从库解析 binlog，直投 RocketMQ（flat JSON，remoting 协议）。
  # 消息路由见 deploy/canal/instance.properties；Java 消费方为 product 服务的
  # ProductIndexConsumer（商品索引增量同步与缓存失效的变更源）。
  canal:
    image: canal/canal-server:v1.1.8
    depends_on:
      mysql:
        condition: service_healthy
    # 不依赖 compose 内 rocketmq-namesrv：集群态 namesrv 在 host 网络（/opt/cluster），
    # 该依赖会因 profile 未启用而报错；namesrv 可达性由 startup.sh 的等待循环保证。
    environment:
      canal.serverMode: rocketMQ
      CANAL_MYSQL_ADDRESS: "mysql:3306"
      CANAL_MYSQL_USER: smartlect_canal
      CANAL_MYSQL_PASSWORD: ${SMARTLECT_CANAL_MYSQL_PASSWORD:?run bootstrap}
      # 单机形态走 compose 服务名；集群形态下 RocketMQ 由 deploy/cluster 提供，
      # 必须用 SMARTLECT_CANAL_ROCKETMQ_NAMESRV 指向集群成员，否则 canal 启动即 DNS 失败。
      CANAL_ROCKETMQ_NAMESRV: ${SMARTLECT_CANAL_ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
    ports:
      - "127.0.0.1:${SMARTLECT_CANAL_PORT:-11111}:11111"
    volumes:
      - ./canal/instance.properties:/smartlect-canal-instance-template.properties:ro
      - ./canal/canal.properties:/smartlect-canal-template.properties:ro
      - ./canal/startup.sh:/smartlect-canal-startup.sh:ro
    # 镜像无 envsubst：startup.sh 先用 sed 注入 CANAL_* 环境变量再交回官方启动脚本
    command: ["bash", "/smartlect-canal-startup.sh"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:11112/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # XXL-JOB 调度中心：替代 @Scheduled + Redis 锁，任务管理/触发/告警统一到控制台。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.5.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/smartlect_xxljob?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=smartlect_xxljob
        --spring.datasource.password=${SMARTLECT_XXLJOB_MYSQL_PASSWORD:?run bootstrap}
        --xxl.job.accessToken=${SMARTLECT_XXLJOB_TOKEN:?run bootstrap}
    ports:
      - "127.0.0.1:${SMARTLECT_XXLJOB_PORT:-18090}:8080"
    mem_limit: 512m
    healthcheck:
      # 镜像里既没有 curl 也没有 wget，原先的 curl 探活恒失败（容器永远 unhealthy）。
      # 用 bash 的 /dev/tcp 探测 Web 端口——端口在监听即视为就绪。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # LiteLLM 网关：统一模型路由/降级/成本追踪，替代 provider.py 厂商分支。
  # 非硬依赖：assistant 直连上游仍可用（base_url 切换即回退）。
  # 挂在 litellm profile 下：批次五 provider 回退后暂无消费者，默认不随 infra-up 启动
  # （docker compose --profile litellm up -d litellm 显式启用）。
  litellm:
    profiles: ["litellm"]
    image: ghcr.io/berriai/litellm:main-v1.78-stable
    env_file:
      # required: false —— 缺 model.env 时 compose 会直接报错退出，
      # 那会连带阻断 `docker compose config` 等全量校验。
      - path: ./model.env
        required: false
    environment:
      LITELLM_MASTER_KEY: ${SMARTLECT_LITELLM_MASTER_KEY:?run bootstrap}
    ports:
      - "127.0.0.1:${SMARTLECT_LITELLM_PORT:-14000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    mem_limit: 384m
    healthcheck:
      # python 基础镜像不带 curl，改用解释器自身的 urllib 探活。
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  mysql:
  redis:
  rocketmq-store:
  es-data:
  qdrant-data:
