server:
  port: ${SMARTLECT_COUPON_PORT:18088}
  shutdown: graceful

spring:
  config:
    import:
      # 本地 classpath 兜底优先级最低；Nacos 可达且存在同名 dataId 时以后者为准。
      # 三者都写 optional：配置中心缺失/不可达时退回本地 yml，而不是启动失败。
      - optional:classpath:smartlect-common.yml
      - optional:nacos:smartlect-common.yml?group=SMARTLECT_GROUP&refreshEnabled=false
      - optional:nacos:smartlect-coupon.yml?group=SMARTLECT_GROUP&refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: smartlect-coupon
  cloud:
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      health-check:
        initial-delay: 0
        interval: 15s
        path:
          default: /actuator/health
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    nacos:
      config:
        server-addr: ${SMARTLECT_NACOS_ADDR:127.0.0.1:18848}
        username: ${SMARTLECT_NACOS_USERNAME:}
        password: ${SMARTLECT_NACOS_PASSWORD:}
        group: SMARTLECT_GROUP
      discovery:
        server-addr: ${SMARTLECT_NACOS_ADDR:127.0.0.1:18848}
        username: ${SMARTLECT_NACOS_USERNAME:nacos}
        password: ${SMARTLECT_NACOS_PASSWORD:}
        namespace: ${SMARTLECT_NACOS_NAMESPACE:}
        group: ${SMARTLECT_NACOS_GROUP:SMARTLECT_GROUP}
        prefer-ip-address: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    sentinel:
      transport:
        dashboard: ${SMARTLECT_SENTINEL_DASHBOARD:}
      eager: true
  datasource:
    url: jdbc:mysql://${SMARTLECT_MYSQL_HOST:127.0.0.1}:${SMARTLECT_MYSQL_PORT:13306}/smartlect_coupon?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useSSL=false
    username: ${SMARTLECT_MYSQL_USER:smartlect_app}
    password: ${SMARTLECT_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    user: ${SMARTLECT_FLYWAY_USER:smartlect_flyway}
    password: ${SMARTLECT_FLYWAY_PASSWORD:}
  data:
    redis:
      host: ${SMARTLECT_REDIS_HOST:127.0.0.1}
      port: ${SMARTLECT_REDIS_PORT:16379}
      username: ${SMARTLECT_REDIS_USERNAME:}
      password: ${SMARTLECT_REDIS_PASSWORD:}
      database: ${SMARTLECT_REDIS_DB:0}
      ssl:
        enabled: ${SMARTLECT_REDIS_SSL_ENABLED:false}

mybatis:
  mapper-locations: classpath*:com/smartlect/mappers/*.xml
  type-aliases-package: com.smartlect.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  # 打开后 CouponRushReconcileTask 才注册；多实例部署时任务本身有 Redis 锁，
  # 不需要只在单个实例上开。
  common-scheduling:
    enabled: true

mq:
  compensation:
    # V3 已建 mq_compensation_log；退款还券的消费失败会落库，由本任务每分钟重放。
    # 开关语义（与源码一致）：@ConditionalOnProperty 只认显式 true，没有 matchIfMissing。
    auto-replay-enabled: true
    # 打开消费失败（exchange=mq.consume）的自动重放：退款还券是 USED→NOUSE 幂等条件更新，
    # 重复重放不会造成二次返还。其它域保持默认 false，消费失败交给人工判断。
    auto-replay-consume: true

smartlect:
  rocketmq:
    endpoints: ${SMARTLECT_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
  internal:
    token: ${SMARTLECT_INTERNAL_TOKEN:}
    auth-enabled: true
dubbo:
  application:
    name: smartlect-coupon
    qos-enable: false
