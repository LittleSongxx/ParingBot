server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # 基础安全响应头：禁 MIME 类型嗅探、禁被别的站点 iframe 嵌套、跨站跳转不带完整路径
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://backend:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # 文件下载只放行服务端生成的地址：/files/download/<32位hex>.<图片扩展名>。
    # 任务要求同时兼容单段 /files/<文件名> 的形式，所以两段都按正则白名单放行；
    # proxy_pass 不带 URI，原样把 /files/... 转给后端，后端会再校验一次文件名。
    location ~ "^/files/download/[0-9a-f]{32}\.(jpg|jpeg|png|webp|gif)$" {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ "^/files/[A-Za-z0-9._-]+$" {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其它 /files* 一律 404，不再回落到 SPA 的 index.html
    location /files/ {
        return 404;
    }

    location = /files {
        return 404;
    }

    location / {
        # $request_uri 是未归一化的原始 URI：像 /files/download/..%2F..%2Fmain.py
        # 这类请求会被 nginx 归一化成 /main.py 后落到这里，这里按原文再挡一次，
        # 保证「GET 其它 /files* → 404」而不是拿到一个 200 的 SPA 页面
        if ($request_uri ~ "^/files") {
            return 404;
        }
        try_files $uri $uri/ /index.html;
    }
}
