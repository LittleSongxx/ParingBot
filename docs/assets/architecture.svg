<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-label="Smartlect 架构：Vue 双端 → 网关 → Python 导购 Agent ｜ Java 交易权威 → 数据面">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.8 L9.4 5 L0 9.2 z" fill="#94a3b8"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.8 L9.4 5 L0 9.2 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.8 L9.4 5 L0 9.2 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1180" height="660" fill="#ffffff"/>

  <rect x="24" y="20" width="1132" height="86" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="44" fill="#94a3b8" font-size="12.5" font-weight="700" letter-spacing="1">浏览器端（Vue 3 · 只负责把状态画出来）</text>
  <rect x="44" y="54" width="220" height="40" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="60" y="79" fill="#5b21b6" font-size="13.5" font-weight="700">用户端 :18180</text>
  <rect x="284" y="54" width="220" height="40" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="300" y="79" fill="#5b21b6" font-size="13.5" font-weight="700">管理端 :18181</text>
  <text x="532" y="79" fill="#64748b" font-size="12.5">静态资源 + /api 与 /admin-api 反代 · 权限由服务端拒绝</text>

  <path d="M144 106 V 140" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M394 106 V 140" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <rect x="44" y="142" width="460" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="163" fill="#1e293b" font-size="13.5" font-weight="700">nginx（线上）</text>
  <text x="60" y="181" fill="#64748b" font-size="12">TLS · 静态站 · /api 不缓冲（SSE 直通）· /actuator 不对外反代</text>

  <path d="M274 190 V 224" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="44" y="226" width="460" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="60" y="249" fill="#047857" font-size="14" font-weight="700">网关 :18080（Spring Cloud Gateway · Sa-Token 会话键）</text>
  <text x="60" y="269" fill="#334155" font-size="12">16 条路由 · 鉴权限流 · 剥离伪造身份头后转发 · 自己做权限判定的是服务端注解</text>

  <path d="M180 288 V 330" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <text x="188" y="313" fill="#64748b" font-size="12">/api/** 与 /admin-api/**</text>
  <path d="M400 288 V 330" stroke="#d97706" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="408" y="313" fill="#64748b" font-size="12">/api/assistant/**</text>

  <rect x="44" y="332" width="560" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="356" fill="#1d4ed8" font-size="13" font-weight="700">交易权威：9 个 Java 服务 · 每服务一个独立库（唯一写口）</text>
  <rect x="60" y="366" width="126" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="70" y="386" fill="#1e293b" font-size="12.5" font-weight="600">user :18105</text>
  <text x="70" y="402" fill="#64748b" font-size="11">账号 / 地址 / RBAC</text>
  <rect x="196" y="366" width="126" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="206" y="386" fill="#1e293b" font-size="12.5" font-weight="600">product :18106</text>
  <text x="206" y="402" fill="#64748b" font-size="11">目录 / SKU / 多级缓存</text>
  <rect x="332" y="366" width="126" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="342" y="386" fill="#1e293b" font-size="12.5" font-weight="600">stock :18108</text>
  <text x="342" y="402" fill="#64748b" font-size="11">条件扣减 + 台账</text>
  <rect x="468" y="366" width="120" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="478" y="386" fill="#1e293b" font-size="12.5" font-weight="600">cart :18102</text>
  <text x="478" y="402" fill="#64748b" font-size="11">购物车</text>
  <rect x="60" y="420" width="126" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="70" y="440" fill="#1e293b" font-size="12.5" font-weight="600">order :18104</text>
  <text x="70" y="456" fill="#64748b" font-size="11">幂等下单 / 状态机</text>
  <rect x="196" y="420" width="126" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="206" y="440" fill="#1e293b" font-size="12.5" font-weight="600">pay :18103</text>
  <text x="206" y="456" fill="#64748b" font-size="11">模拟渠道 / 退款</text>
  <rect x="332" y="420" width="126" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="342" y="440" fill="#1e293b" font-size="12.5" font-weight="600">coupon :18107</text>
  <text x="342" y="456" fill="#64748b" font-size="11">券 / 秒杀</text>
  <rect x="468" y="420" width="120" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="478" y="440" fill="#1e293b" font-size="12.5" font-weight="600">admin :18101</text>
  <text x="478" y="456" fill="#64748b" font-size="11">管理端 BFF</text>
  <text x="60" y="490" fill="#475569" font-size="11.5">服务间只走 Dubbo（timeout 10s / retries 0）或 /internal/** + X-Internal-Token</text>
  <text x="60" y="510" fill="#475569" font-size="11.5">一致性：本地事务 + 幂等账本 + 事务性 Outbox + 定时消息 + 补偿重放 + 对账任务</text>

  <rect x="628" y="332" width="528" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="644" y="356" fill="#b45309" font-size="13" font-weight="700">导购 Agent（Python，非确定性）</text>
  <text x="644" y="378" fill="#334155" font-size="12">Assistant :18000 · FastAPI + LangGraph 三节点（model → tools → answer）</text>
  <text x="644" y="398" fill="#334155" font-size="12">20 个工具：检索 / 订单只读 / 提案 / 记忆 / 派发子智能体</text>
  <text x="644" y="418" fill="#334155" font-size="12">预算：模型 ≤8 · 工具 ≤10 · 检索 ≤2 · 90s 墙钟 · 超限确定性收口</text>
  <text x="644" y="438" fill="#64748b" font-size="11.5">成交权不在这里：只能生成待确认提案，人点确认后由 Java 落单</text>

  <path d="M628 400 C 610 400, 612 392, 604 392" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <path d="M604 396 C 640 470, 640 530, 560 548" stroke="#059669" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
  <path d="M560 548 H 470" stroke="#059669" stroke-width="1.2" fill="none" marker-end="url(#ag)"/>
  <text x="352" y="545" fill="#047857" font-size="12">价格 / 库存 / 订单状态实时回问（不进向量）</text>

  <rect x="628" y="470" width="256" height="72" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="644" y="492" fill="#1e293b" font-size="12.5" font-weight="700">混检（只查已发布知识）</text>
  <text x="644" y="511" fill="#475569" font-size="11.5">ES BM25(IK) top50 ‖ Qdrant top50</text>
  <text x="644" y="529" fill="#475569" font-size="11.5">→ RRF(k=60) → gte-rerank → top8 → 引用 ≤4</text>
  <rect x="900" y="470" width="256" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="916" y="492" fill="#1e293b" font-size="12.5" font-weight="700">模型接入（可热切换）</text>
  <text x="916" y="511" fill="#475569" font-size="11.5">OpenAI 兼容端点白名单 + 模型白名单</text>
  <text x="916" y="529" fill="#475569" font-size="11.5">端点/密钥缺失时明确失败，不静默降级</text>

  <rect x="44" y="568" width="1132" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="592" fill="#94a3b8" font-size="12.5" font-weight="700" letter-spacing="1">数据面：10 个中间件容器（docker compose）</text>
  <text x="64" y="614" fill="#334155" font-size="12">MySQL 8.4（每服务独立库 · binlog ROW）· Redis 7.4 · RocketMQ 5.3（三件套 · 任意精度定时消息）· Nacos 2.5</text>
  <text x="64" y="632" fill="#334155" font-size="12">ES 8.19 + IK · Qdrant 1.15 · Canal 1.1.8（binlog → MQ → 商品索引与缓存失效）· xxl-job 2.5（9 个任务）</text>
</svg>
